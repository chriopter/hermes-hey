name: hey-platform
label: HEY
kind: platform
version: 0.1.1
description: >
  Native HEY email gateway adapter for Hermes Agent. Uses the official HEY CLI
  watch stream, authorizes sender addresses before persistence, durably queues
  accepted messages, routes one Hermes session per HEY thread, and sends one
  confirmed final reply back to the same thread.
author: Christopher (chriopter)
